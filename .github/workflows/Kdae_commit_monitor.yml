name: Kdae Commit Monitor

env:
  REPO_URL: https://github.com/olicesx/dae.git
  REPO_BRANCH: kdae

"on":
  workflow_dispatch:
  schedule:
    - cron: "25 * * * *"

jobs:
  check:
    name: Check Kdae Updates
    runs-on: ubuntu-latest

    permissions:
      actions: write
      contents: write

    steps:
      - name: Get Latest Kdae Commit
        id: getHash
        run: |
          git clone --depth 1 -b "$REPO_BRANCH" "$REPO_URL" kdae-src
          cd kdae-src
          echo "commitHash=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check Kdae Commit Update
        id: cacheHash
        uses: actions/cache@v6
        with:
          path: .commitHash
          key: KDAE-${{ env.REPO_BRANCH }}-${{ steps.getHash.outputs.commitHash }}

      - name: Save Latest Kdae Commit
        if: steps.cacheHash.outputs.cache-hit != 'true'
        run: |
          echo "${{ steps.getHash.outputs.commitHash }}" > .commitHash

      - name: Notify Kdae Update via Telegram
        if: steps.cacheHash.outputs.cache-hit != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_HASH: ${{ steps.getHash.outputs.commitHash }}
        run: |
          MESSAGE="🚀 Kdae 检测到新提交

          📦 项目：olicesx/dae
          🌿 分支：kdae
          🔖 Commit：${COMMIT_HASH}

          ✨ Kdae 代码已更新
          🛠️ 可进行新一轮 OpenWrt Kdae 编译"

          curl -sS \
            -X POST \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"text\":\"${MESSAGE}\"}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"

      - name: Notify Kdae Update via Bark
        if: steps.cacheHash.outputs.cache-hit != 'true'
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          COMMIT_HASH: ${{ steps.getHash.outputs.commitHash }}
        run: |
          curl -G \
            --data-urlencode "title=Kdae 检测到新提交 🚀" \
            --data-urlencode "body=项目：olicesx/dae；分支：kdae；Commit：${COMMIT_HASH}；Kdae 代码已更新，可进行新一轮 OpenWrt Kdae 编译" \
            "https://api.day.app/${BARK_KEY}"