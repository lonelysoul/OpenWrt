name: Kdae Commit Monitor

env:
  REPO_URL: https://github.com/olicesx/dae.git
  REPO_BRANCH: kdae

on:
  workflow_dispatch:
  schedule:
    - cron: '25 * * * *'

jobs:
  check:
    name: Check Kdae Updates
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write

    steps:

    # 🔍 获取 Kdae 最新 Commit
    - name: Get Latest Kdae Commit
      id: getHash
      run: |
        git clone --depth 1 -b "$REPO_BRANCH" "$REPO_URL" kdae-src
        cd kdae-src
        echo "commitHash=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    # 🔄 检查 Kdae 是否有新提交
    - name: Check Kdae Commit Update
      id: cacheHash
      uses: actions/cache@v6
      with:
        path: .commitHash
        key: KDAE-${{ env.REPO_BRANCH }}-${{ steps.getHash.outputs.commitHash }}

    # 💾 保存最新 Kdae Commit
    - name: Save Latest Kdae Commit
      if: steps.cacheHash.outputs.cache-hit != 'true'
      run: |
        echo "${{ steps.getHash.outputs.commitHash }}" > .commitHash

    # 📢 Telegram：Kdae 更新通知
    - name: Notify Kdae Update via Telegram
      if: steps.cacheHash.outputs.cache-hit != 'true'
      uses: actions/github-script@v9
      with:
        script: |
          const token = process.env.TELEGRAM_BOT_TOKEN;
          const chat = process.env.TELEGRAM_CHAT_ID;
          const commit = '${{ steps.getHash.outputs.commitHash }}';

          const msg = `🚀 Kdae 有新提交

📦 项目：olicesx/dae
🌿 分支：kdae
🔖 Commit：${commit}

✨ 检测到 Kdae 代码更新
🛠️ 可准备进行新一轮 OpenWrt Kdae 编译。`;

          await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              chat_id: chat,
              text: msg
            })
          });
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    # 📢 Bark：Kdae 更新通知
    - name: Notify Kdae Update via Bark
      if: steps.cacheHash.outputs.cache-hit != 'true'
      run: |
        curl "https://api.day.app/${{ secrets.BARK_KEY }}/Kdae_检测到新提交🚀/项目：olicesx%2Fdae%0A分支：kdae%0ACommit：${{ steps.getHash.outputs.commitHash }}%0A已检测到Kdae代码更新，可准备进行新一轮OpenWrt编译。"