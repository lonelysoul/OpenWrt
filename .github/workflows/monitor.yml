name: Monitor GitHub Commits

on:
  schedule:
    # 每 15 分钟检查一次（时间启动范围：每天 1:00～15:45，共 16 个小时）
    - cron: "*/15 1-15 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout monitor repository
        uses: actions/checkout@v4
        with:
          # 注意：必须设置为 true，否则下面 git push 会报 Auth 失败或权限不足
          persist-credentials: true
          clean: false

      - name: Check commits and send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          mkdir -p .state

          # ==========================================================
          # 监控仓库
          # ==========================================================
          REPOS=(
            "QiuSimons/luci-app-honk"
            "QiuSimons/luci-app-dae"
            "lonelysoul/OpenWrt"
          )

          API="https://api.github.com/repos"

          for REPO in "${REPOS[@]}"; do

            echo "========================================"
            echo "Checking: $REPO"
            echo "========================================"

            OWNER="${REPO%%/*}"
            NAME="${REPO##*/}"

            STATE_FILE=".state/${OWNER}_${NAME}.sha"

            RESPONSE=$(curl -fsSL \
              --retry 5 \
              --retry-delay 3 \
              --retry-max-time 30 \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API}/${REPO}/commits?per_page=20")

            # 最新 Commit SHA
            LATEST_SHA=$(echo "$RESPONSE" | jq -r '.[0].sha')

            if [ -z "$LATEST_SHA" ] || [ "$LATEST_SHA" = "null" ]; then
              echo "❌ Failed to get latest commit for $REPO"
              continue
            fi

            # 第一次运行：初始化，不发通知
            if [ ! -f "$STATE_FILE" ]; then
              echo "$LATEST_SHA" > "$STATE_FILE"
              echo "🟡 First run for $REPO. Current commit: $LATEST_SHA"
              continue
            fi

            LAST_SHA=$(cat "$STATE_FILE")

            # 没有更新
            if [ "$LATEST_SHA" = "$LAST_SHA" ]; then
              echo "✅ No new commits."
              continue
            fi

            echo "🔔 New commits detected!"
            echo "Last: $LAST_SHA"
            echo "Latest: $LATEST_SHA"

            # 避免使用管道符 | 导致子 Shell 变量隔离，改用 Process Substitution
            FOUND_LAST=false

            while read -r COMMIT; do
              [ -z "$COMMIT" ] && continue

              SHA=$(echo "$COMMIT" | jq -r '.sha')

              # 匹配到上一次已经推送过的 Commit
              if [ "$SHA" = "$LAST_SHA" ]; then
                FOUND_LAST=true
                continue
              fi

              # 未找到旧 Commit 且不等于最新 Commit 时跳过
              if [ "$FOUND_LAST" = "false" ] && [ "$SHA" != "$LATEST_SHA" ]; then
                continue
              fi

              MESSAGE=$(echo "$COMMIT" | jq -r '.commit.message')
              TITLE=$(echo "$MESSAGE" | head -n 1)
              BODY=$(echo "$MESSAGE" | tail -n +2 | sed '/^[[:space:]]*$/d')

              AUTHOR=$(echo "$COMMIT" | jq -r '
                if .author.login != null
                then .author.login
                else .commit.author.name
                end
              ')

              DATE=$(echo "$COMMIT" | jq -r '.commit.author.date')
              SHORT_SHA="${SHA:0:7}"
              URL="https://github.com/${REPO}/commit/${SHA}"

              TEXT="🔔 <b>GitHub Commit</b>

                📦 <b>${NAME}</b>
                👤 ${AUTHOR}
                🕐 ${DATE}
                🔑 <code>${SHORT_SHA}</code>
                
                <b>${TITLE}</b>"
                
              if [ -n "$BODY" ]; then
                TEXT="${TEXT}

                ${BODY}"
              fi

              TEXT="${TEXT}

                🔗 <a href=\"${URL}\">查看 Commit</a>"

              curl -fsSL \
                -X POST \
                "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d "chat_id=${TELEGRAM_CHAT_ID}" \
                --data-urlencode "text=${TEXT}" \
                -d "parse_mode=HTML" >/dev/null

              echo "✅ Notification sent: ${REPO} ${SHORT_SHA}"

            done < <(echo "$RESPONSE" | jq -c '.[]' | tac)

            # 更新本仓库最新的 SHA 到本地状态文件
            echo "$LATEST_SHA" > "$STATE_FILE"

          done

      - name: Save commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]"

          git add .state/

          if git diff --cached --quiet; then
            echo "✅ No state changes."
          else
            git commit -m "chore: update commit monitor state"
            git push
          fi
