name: Monitor Repositories

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. 恢复最新的 Cache（优先匹配最新运行生成的动态 Key，匹配不到则兜底回退）
      - name: Restore last commit hashes cache
        uses: actions/cache/restore@v6
        with:
          path: last_commits.json
          key: repo-monitor-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            repo-monitor-${{ runner.os }}-

      # 2. 执行检测脚本并更新 last_commits.json
      - name: Check Repositories and Notify Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -c '
          import os, json, urllib.request, urllib.parse

          REPOS = [
              "QiuSimons/luci-app-honk",,
              "QiuSimons/luci-app-dae",
              "lonelysoul/OpenWrt"
          ]

          BOT_TOKEN = os.environ.get("TG_BOT_TOKEN")
          CHAT_ID = os.environ.get("TG_CHAT_ID")
          CACHE_FILE = "last_commits.json"

          state = {}
          if os.path.exists(CACHE_FILE):
              try:
                  with open(CACHE_FILE, "r") as f:
                      state = json.load(f)
              except Exception as e:
                  print(f"读取 Cache 失败: {e}")

          def send_tg_message(text):
              url = f"https://api.telegram.org/bot{BOT_TOKEN}/sendMessage"
              data = urllib.parse.urlencode({
                  "chat_id": CHAT_ID,
                  "text": text,
                  "parse_mode": "Markdown",
                  "disable_web_page_preview": "true"
              }).encode("utf-8")
              req = urllib.request.Request(url, data=data)
              try:
                  with urllib.request.urlopen(req) as resp:
                      pass
              except Exception as e:
                  print(f"发送 Telegram 消息失败: {e}")

          def get_commit_detail(repo, sha):
              url = f"https://api.github.com/repos/{repo}/commits/{sha}"
              req = urllib.request.Request(url, headers={"User-Agent": "GitHub-Action-Monitor"})
              try:
                  with urllib.request.urlopen(req) as resp:
                      return json.loads(resp.read().decode("utf-8"))
              except Exception:
                  return None

          new_state = state.copy()

          for repo in REPOS:
              api_url = f"https://api.github.com/repos/{repo}/commits?per_page=10"
              req = urllib.request.Request(api_url, headers={"User-Agent": "GitHub-Action-Monitor"})
              
              try:
                  with urllib.request.urlopen(req) as resp:
                      commits = json.loads(resp.read().decode("utf-8"))
              except Exception as e:
                  continue

              if not commits:
                  continue

              latest_sha = commits[0]["sha"]
              last_seen_sha = state.get(repo)

              if not last_seen_sha:
                  print(f"[{repo}] 首次初始化，保存最新 SHA: {latest_sha[:7]}")
                  new_state[repo] = latest_sha
                  continue

              if latest_sha != last_seen_sha:
                  new_commits = []
                  for c in commits:
                      if c["sha"] == last_seen_sha:
                          break
                      new_commits.append(c)

                  new_commits.reverse()

                  for c in new_commits:
                      sha = c["sha"]
                      detail = get_commit_detail(repo, sha)
                      
                      full_msg = c["commit"]["message"].strip()
                      if len(full_msg) > 1000:
                          full_msg = full_msg[:1000] + "\n...(内容过长已截断)"

                      author = c["commit"]["author"]["name"]
                      url = c["html_url"]
                      sha_short = sha[:7]

                      file_stats = ""
                      if detail and "files" in detail:
                          files = detail["files"]
                          file_list = [f"- `{f['filename']}` ({f['status']})" for f in files[:5]]
                          if len(files) > 5:
                              file_list.append(f"- ... 等共 {len(files)} 个文件")
                          file_stats = "\n📁 *修改文件*:\n" + "\n".join(file_list)

                      tg_text = (
                          f"🚀 *[{repo}]* 收到新 Commit\n\n"
                          f"👤 *作者*: `{author}`\n"
                          f"🔗 *Hash*: [{sha_short}]({url})\n\n"
                          f"📝 *完整 Commit 信息*:\n```\n{full_msg}\n```"
                          f"{file_stats}"
                      )
                      send_tg_message(tg_text)

                  new_state[repo] = latest_sha

          # 写入本地文件供后续 Save 步骤保存
          with open(CACHE_FILE, "w") as f:
              json.dump(new_state, f, indent=2)
          '

      # 3. 将更新后的 last_commits.json 保存为本次运行独一无二的新 Cache Key
      - name: Save updated commit state to cache
        uses: actions/cache/save@v6
        if: always()
        with:
          path: last_commits.json
          key: repo-monitor-${{ runner.os }}-${{ github.run_id }}
