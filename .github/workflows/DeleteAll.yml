name: Delete Old Actions and Releases

on:
  workflow_dispatch:
    inputs:
      keep_releases:
        description: '保留最新 Release 的数量'
        required: true
        default: '1'
      keep_runs:
        description: '保留最新 Workflow Runs 的数量（最少为 1，以防报错）'
        required: true
        default: '1'

permissions:
  actions: write
  releases: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete Old Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_COUNT: ${{ github.event.inputs.keep_releases }}
        run: |
          echo "=== 开始清理 Releases，保留最新 ${KEEP_COUNT} 个 ==="
          # 获取所有 release 的 tag 列表，按创建时间排序，跳过最新的 N 个
          releases_to_delete=$(gh release list --repo ${{ github.repository }} --limit 1000 | awk -F'\t' '{print $3}' | tail -n +$((KEEP_COUNT + 1)))
          
          for tag in $releases_to_delete; do
            echo "正在删除 Release: $tag"
            gh release delete "$tag" --repo ${{ github.repository }} --cleanup-tag -y || true
          done

      - name: Delete Old Workflow Runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_COUNT: ${{ github.event.inputs.keep_runs }}
        run: |
          echo "=== 开始清理 Workflow Runs，保留最新 ${KEEP_COUNT} 个 ==="
          # 获取当前仓库所有 run ID（按从新到旧排列），跳过最新的 N 个
          runs_to_delete=$(gh api repos/${{ github.repository }}/actions/runs --paginate -q '.workflow_runs[].id' | tail -n +$((KEEP_COUNT + 1)))
          
          for run_id in $runs_to_delete; do
            echo "正在删除 Run ID: $run_id"
            gh api -X DELETE repos/${{ github.repository }}/actions/runs/$run_id || true
          done